<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Narges ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- نورهای متحرک پس زمینه -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <!-- ذرات شناور -->
    <div class="particles" id="particles"></div>


    <!-- =========================
         مرحله اول
    ========================== -->

    <section class="welcome" id="welcomeSection">

        <div class="intro-content">

           

            <button id="startButton">

                <span>
                    بزن بریم
                </span>

                <span class="button-heart">
                    ♡
                </span>

            </button>

        </div>


        <!-- پیام دوست دارم -->
        <div class="love-container" id="loveMessage">

    <div class="heart-glow"></div>

    <div class="love-language" id="loveLanguage">
        دوست دارم
    </div>

    <span class="love-heart">❤️</span>

</div>


        <!-- پیام اسکرول -->
        <div class="scroll-message" id="scrollMessage">

            <p>
                حالا برو پایین صفحه
            </p>

            <span class="scroll-arrow">
                ↓
            </span>

        </div>

    </section>


    <!-- =========================
         مرحله دوم
    ========================== -->

    <section class="waiting" id="waitingSection">

        <div class="waiting-content">

            <div class="loader">

                <div class="loader-ring"></div>

                <div class="loader-inner"></div>

                <span id="timer">
                    10
                </span>

            </div>

            <h2>
                ده ثانیه صبر کن...
            </h2>

            <p>
                و بعد بیا بازم بالا
            </p>

        </div>

    </section>


    <!-- =========================
         مرحله سوم
         عکس ها
    ========================== -->

    <section class="memories" id="memoriesSection">

        <div class="memories-intro">

            <span class="memories-small">
                توصیف ت
            </span>

            <h3>
                در شان کسی نیست،به جز من!
            </h3>

            <p>تعریف شراب از دهن مست قبول است.
            </p>

        </div>


        <!-- گالری -->

        <div class="memory-gallery">


            <!-- عکس اول -->

            <div class="memory-card">

                <div class="memory-image">

                    <img
                        src="images/Screenshot 2026-09-19 125941.png"
                        alt="خاطره اول"
                    >

                </div>

                <div class="memory-caption">

                   

                </div>

            </div>


            <!-- عکس دوم -->

            <div class="memory-card">

                <div class="memory-image">

                    <img
                        src="images/Screenshot 2026-09-21 174929.png"
                        alt="خاطره دوم"
                    >

                </div>

                <div class="memory-caption">

                  

                </div>

            </div>
            


            <!-- عکس سوم -->

            <div class="memory-card">

                <div class="memory-image">

                    <img
                        src="images/Screenshot 2026-09-21 174901.png"
                        alt="خاطره سوم"
                    >

                </div>

                <div class="memory-caption">

                   

                </div>

            </div>


        </div>


        <!-- پیام پایانی -->

        <div class="memories-ending">

            <span class="ending-heart">
                ♡
            </span>

            <p>
                هنوز کلی خاطره مونده...
            </p>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
